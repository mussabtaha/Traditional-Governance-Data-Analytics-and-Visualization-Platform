<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
  <title id="title">How the Traditional Governance platform works</title>
  <desc id="desc">Six numbered steps show a page opening, a JavaScript request, Flask validation, a MySQL query, a JSON response, and interface updates.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0L11 5.5 0 11Z" fill="#C8A96A"/>
    </marker>
  </defs>
  <rect width="1400" height="430" rx="28" fill="#123524"/>
  <text x="54" y="62" fill="#FFFFFF" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">How the Platform Works</text>
  <text x="54" y="94" fill="#C8D8CE" font-family="Segoe UI,Arial,sans-serif" font-size="17">A request becomes a focused visual result in six steps</text>
  <g font-family="Segoe UI,Arial,sans-serif">
    <g transform="translate(50 145)"><rect width="190" height="150" rx="18" fill="#FFFFFF"/><circle cx="35" cy="35" r="21" fill="#C8A96A"/><text x="35" y="42" text-anchor="middle" fill="#123524" font-size="20" font-weight="700">1</text><text x="24" y="83" fill="#123524" font-size="18" font-weight="700">Open a page</text><text x="24" y="110" fill="#64736B" font-size="14">Home, Groups,</text><text x="24" y="131" fill="#64736B" font-size="14">Statistics, or Comparison</text></g>
    <g transform="translate(270 145)"><rect width="190" height="150" rx="18" fill="#FFFFFF"/><circle cx="35" cy="35" r="21" fill="#C8A96A"/><text x="35" y="42" text-anchor="middle" fill="#123524" font-size="20" font-weight="700">2</text><text x="24" y="83" fill="#123524" font-size="18" font-weight="700">JavaScript fetches</text><text x="24" y="110" fill="#64736B" font-size="14">Only the data needed</text><text x="24" y="131" fill="#64736B" font-size="14">for the current view</text></g>
    <g transform="translate(490 145)"><rect width="190" height="150" rx="18" fill="#FFFFFF"/><circle cx="35" cy="35" r="21" fill="#C8A96A"/><text x="35" y="42" text-anchor="middle" fill="#123524" font-size="20" font-weight="700">3</text><text x="24" y="83" fill="#123524" font-size="18" font-weight="700">Flask validates</text><text x="24" y="110" fill="#64736B" font-size="14">Parameters, filters,</text><text x="24" y="131" fill="#64736B" font-size="14">sorting, and pagination</text></g>
    <g transform="translate(710 145)"><rect width="190" height="150" rx="18" fill="#FFFFFF"/><circle cx="35" cy="35" r="21" fill="#C8A96A"/><text x="35" y="42" text-anchor="middle" fill="#123524" font-size="20" font-weight="700">4</text><text x="24" y="83" fill="#123524" font-size="18" font-weight="700">MySQL queries</text><text x="24" y="110" fill="#64736B" font-size="14">Filters, counts, sorts,</text><text x="24" y="131" fill="#64736B" font-size="14">and returns one page</text></g>
    <g transform="translate(930 145)"><rect width="190" height="150" rx="18" fill="#FFFFFF"/><circle cx="35" cy="35" r="21" fill="#C8A96A"/><text x="35" y="42" text-anchor="middle" fill="#123524" font-size="20" font-weight="700">5</text><text x="24" y="83" fill="#123524" font-size="18" font-weight="700">Flask returns JSON</text><text x="24" y="110" fill="#64736B" font-size="14">Consistent success, data,</text><text x="24" y="131" fill="#64736B" font-size="14">pagination, or errors</text></g>
    <g transform="translate(1150 145)"><rect width="200" height="150" rx="18" fill="#FFF8E9"/><circle cx="35" cy="35" r="21" fill="#C8A96A"/><text x="35" y="42" text-anchor="middle" fill="#123524" font-size="20" font-weight="700">6</text><text x="24" y="83" fill="#123524" font-size="18" font-weight="700">Interface updates</text><text x="24" y="110" fill="#6E5B36" font-size="14">Cards, tables, charts,</text><text x="24" y="131" fill="#6E5B36" font-size="14">maps, and comparisons</text></g>
  </g>
  <g stroke="#C8A96A" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M242 220H262"/><path d="M462 220H482"/><path d="M682 220H702"/><path d="M902 220H922"/><path d="M1122 220H1142"/>
  </g>
  <text x="700" y="360" text-anchor="middle" fill="#D8E5DD" font-family="Segoe UI,Arial,sans-serif" font-size="16">A new filter or page selection repeats the same focused request cycle—without downloading the full dataset.</text>
</svg>
