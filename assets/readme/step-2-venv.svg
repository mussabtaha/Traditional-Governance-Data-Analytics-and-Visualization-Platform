<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">Terminal command illustration: create and activate the virtual environment</title>
  <desc id="desc">PowerShell enters backend-flask, creates .venv, and activates it.</desc>
  <rect width="1200" height="350" rx="24" fill="#0D271D"/>
  <rect width="1200" height="58" rx="24" fill="#123524"/><rect y="35" width="1200" height="23" fill="#123524"/>
  <circle cx="34" cy="29" r="7" fill="#E96B62"/><circle cx="58" cy="29" r="7" fill="#E8B84A"/><circle cx="82" cy="29" r="7" fill="#55B77B"/>
  <text x="110" y="36" fill="#D8E5DD" font-family="Segoe UI,Arial,sans-serif" font-size="16">Terminal command illustration · Step 2</text>
  <text x="42" y="105" fill="#C8A96A" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">CREATE THE PYTHON ENVIRONMENT</text>
  <g font-family="Consolas,monospace" font-size="19">
    <text x="42" y="155" fill="#8ED0AA">PS&gt;</text><text x="92" y="155" fill="#FFFFFF">cd backend-flask</text>
    <text x="42" y="205" fill="#8ED0AA">PS&gt;</text><text x="92" y="205" fill="#FFFFFF">python -m venv .venv</text>
    <text x="42" y="255" fill="#8ED0AA">PS&gt;</text><text x="92" y="255" fill="#FFFFFF">.\.venv\Scripts\Activate.ps1</text>
  </g>
  <text x="42" y="315" fill="#8FA399" font-family="Segoe UI,Arial,sans-serif" font-size="15">The activated prompt isolates backend dependencies from the system Python installation.</text>
</svg>
